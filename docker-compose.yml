services:
  mapa-redes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapa-redes-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3020}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
